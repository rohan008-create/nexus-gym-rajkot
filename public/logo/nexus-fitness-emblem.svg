<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Red 3D Gradient -->
    <linearGradient id="emblemRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3A3A"/>
      <stop offset="45%" stop-color="#E50914"/>
      <stop offset="85%" stop-color="#BA0610"/>
      <stop offset="100%" stop-color="#7A0006"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="emblemSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#E50914" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g transform="translate(160, 160)" filter="url(#emblemGlow)">
    <!-- Outer Silver Outer Ring -->
    <circle cx="0" cy="0" r="146" fill="none" stroke="url(#emblemSilver)" stroke-width="8"/>
    <!-- Secondary Dark Ring -->
    <circle cx="0" cy="0" r="134" fill="#0C0D12" stroke="#475569" stroke-width="2"/>
    <!-- Inner Red Accent Ring -->
    <circle cx="0" cy="0" r="126" fill="none" stroke="#E50914" stroke-width="3" stroke-opacity="0.7"/>
    <!-- Badge Core Plate -->
    <circle cx="0" cy="0" r="120" fill="#12131A"/>

    <!-- Bottom Laurel / Arc -->
    <g fill="none" stroke="url(#emblemSilver)" stroke-width="3.5" stroke-linecap="round">
      <path d="M -90 40 C -75 95, 75 95, 90 40"/>
      <path d="M -78 48 C -62 86, 62 86, 78 48" stroke-width="1.8" stroke-opacity="0.7"/>
    </g>

    <!-- Bottom Laurel Nodes & Accent -->
    <g fill="#E2E8F0">
      <rect x="-96" y="28" width="7" height="20" rx="2" transform="rotate(-30, -92, 38)"/>
      <rect x="-82" y="50" width="6" height="17" rx="2" transform="rotate(-50, -79, 58)"/>
      <rect x="-62" y="70" width="6" height="16" rx="2" transform="rotate(-70, -59, 78)"/>
      <circle cx="-36" cy="84" r="4"/>
      <circle cx="0" cy="88" r="5" fill="#E50914"/>
      <circle cx="36" cy="84" r="4"/>
      <rect x="90" y="28" width="7" height="20" rx="2" transform="rotate(30, 93, 38)"/>
      <rect x="76" y="50" width="6" height="17" rx="2" transform="rotate(50, 79, 58)"/>
      <rect x="56" y="70" width="6" height="16" rx="2" transform="rotate(70, 59, 78)"/>
    </g>

    <!-- Twin Bodybuilders Silhouettes -->
    <!-- Left Male Physique Pose -->
    <g fill="url(#emblemRed)">
      <!-- Head -->
      <path d="M -26 -76 C -22 -88, -38 -92, -45 -82 C -49 -76, -47 -64, -40 -62 C -36 -60, -31 -62, -26 -76 Z"/>
      <!-- Traps & Neck -->
      <path d="M -40 -61 C -52 -58, -65 -51, -72 -38 C -63 -40, -47 -44, -36 -46 Z"/>
      <!-- Massive Bicep & Arm -->
      <path d="M -72 -38 C -85 -27, -94 -8, -92 14 C -90 23, -83 27, -76 20 C -72 13, -70 -5, -65 -18 C -60 -31, -54 -36, -49 -39 Z"/>
      <!-- Forearm & Clenched Fist -->
      <path d="M -92 12 C -96 9, -101 -4, -96 -18 C -92 -29, -85 -40, -76 -43 C -72 -44, -74 -36, -81 -25 C -87 -13, -87 3, -92 12 Z"/>
      <!-- Chest / Pecs -->
      <path d="M -24 -46 C -36 -42, -52 -33, -47 -9 C -45 7, -29 14, -20 9 C -15 6, -18 -13, -20 -29 Z"/>
      <!-- Core / Abs -->
      <path d="M -42 -7 C -38 18, -33 40, -20 54 C -15 49, -20 22, -24 7 Z"/>
      <path d="M -33 22 C -29 34, -24 47, -15 58 C -11 56, -15 40, -20 25 Z"/>
      <!-- Wing Lats -->
      <path d="M -60 -13 C -69 5, -65 29, -51 49 C -49 47, -54 27, -51 11 Z"/>
    </g>

    <!-- Right Bodybuilder Pose -->
    <g fill="url(#emblemRed)">
      <!-- Head -->
      <path d="M 26 -76 C 22 -88, 38 -92, 45 -82 C 49 -76, 47 -64, 40 -62 C 36 -60, 31 -62, 26 -76 Z"/>
      <!-- Traps & Neck -->
      <path d="M 40 -61 C 52 -58, 65 -51, 72 -38 C 63 -40, 47 -44, 36 -46 Z"/>
      <!-- Massive Bicep & Arm -->
      <path d="M 72 -38 C 85 -27, 94 -8, 92 14 C 90 23, 83 27, 76 20 C 72 13, 70 -5, 65 -18 C 60 -31, 54 -36, 49 -39 Z"/>
      <!-- Forearm & Clenched Fist -->
      <path d="M 92 12 C 96 9, 101 -4, 96 -18 C 92 -29, 85 -40, 76 -43 C 72 -44, 74 -36, 81 -25 C 87 -13, 87 3, 92 12 Z"/>
      <!-- Chest / Pecs -->
      <path d="M 24 -46 C 36 -42, 52 -33, 47 -9 C 45 7, 29 14, 20 9 C 15 6, 18 -13, 20 -29 Z"/>
      <!-- Core / Abs -->
      <path d="M 42 -7 C 38 18, 33 40, 20 54 C 15 49, 20 22, 24 7 Z"/>
      <path d="M 33 22 C 29 34, 24 47, 15 58 C 11 56, 15 40, 20 25 Z"/>
      <!-- Wing Lats -->
      <path d="M 60 -13 C 69 5, 65 29, 51 49 C 49 47, 54 27, 51 11 Z"/>
    </g>

    <!-- Center Line Accent -->
    <path d="M 0 -70 L 3 -22 L 0 60 L -3 -22 Z" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
