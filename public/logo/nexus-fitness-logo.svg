<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Red 3D Gradient for NEXUS -->
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3A3A"/>
      <stop offset="45%" stop-color="#E50914"/>
      <stop offset="85%" stop-color="#BA0610"/>
      <stop offset="100%" stop-color="#7A0006"/>
    </linearGradient>

    <!-- Red Bevel Shadow -->
    <linearGradient id="redShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800004"/>
      <stop offset="100%" stop-color="#3D0002"/>
    </linearGradient>

    <!-- Chrome Silver Gradient for X Blade -->
    <linearGradient id="chromeSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Silver Ring Gradient -->
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#E50914" flood-opacity="0.3"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ==================== EMBLEM (CIRCULAR BADGE) ==================== -->
  <g transform="translate(145, 160)" filter="url(#badgeShadow)">
    <!-- Outer Silver Outer Ring -->
    <circle cx="0" cy="0" r="128" fill="none" stroke="url(#silverRing)" stroke-width="6"/>
    <!-- Thin Secondary Silver Ring -->
    <circle cx="0" cy="0" r="118" fill="#0C0D12" stroke="#475569" stroke-width="1.5"/>

    <!-- Inner Red Glow Accent Ring -->
    <circle cx="0" cy="0" r="112" fill="none" stroke="#E50914" stroke-width="2.5" stroke-opacity="0.6"/>

    <!-- Background Badge Dark Plate -->
    <circle cx="0" cy="0" r="108" fill="#12131A"/>

    <!-- Athletic Laurel / Dumbbell / Chain Wreath Arch at Bottom -->
    <g fill="none" stroke="url(#silverRing)" stroke-width="3" stroke-linecap="round">
      <!-- Curved Guide Arc -->
      <path d="M -80 35 C -65 85, 65 85, 80 35"/>
      <path d="M -70 42 C -55 78, 55 78, 70 42" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>

    <!-- Dumbbell / Laurel Nodes on Left & Right -->
    <g fill="#E2E8F0">
      <!-- Left side decorative weights/leaves -->
      <rect x="-86" y="24" width="6" height="18" rx="2" transform="rotate(-30, -83, 33)"/>
      <rect x="-74" y="44" width="5" height="15" rx="1.5" transform="rotate(-50, -71, 51)"/>
      <rect x="-56" y="62" width="5" height="14" rx="1.5" transform="rotate(-70, -53, 69)"/>
      <circle cx="-32" cy="74" r="3.5"/>
      <circle cx="0" cy="77" r="4" fill="#E50914"/>
      <circle cx="32" cy="74" r="3.5"/>
      <!-- Right side decorative weights/leaves -->
      <rect x="80" y="24" width="6" height="18" rx="2" transform="rotate(30, 83, 33)"/>
      <rect x="69" y="44" width="5" height="15" rx="1.5" transform="rotate(50, 71, 51)"/>
      <rect x="51" y="62" width="5" height="14" rx="1.5" transform="rotate(70, 53, 69)"/>
    </g>

    <!-- Twin Bodybuilders Silhouettes in Crimson Red -->
    <!-- Left Bodybuilder (Male Physique / Double Bicep Pose Facing Center) -->
    <g fill="url(#redGradient)">
      <!-- Head / Profile -->
      <path d="M -24 -68 C -20 -78, -34 -82, -40 -74 C -44 -68, -42 -58, -36 -56 C -32 -54, -28 -56, -24 -68 Z"/>
      <!-- Muscular Neck & Traps -->
      <path d="M -36 -55 C -46 -52, -58 -46, -64 -35 C -56 -36, -42 -40, -32 -42 Z"/>
      <!-- Left Massive Arm / Bicep -->
      <path d="M -64 -35 C -76 -25, -84 -8, -82 12 C -80 20, -74 24, -68 18 C -64 12, -62 -4, -58 -16 C -54 -28, -48 -32, -44 -35 Z"/>
      <!-- Forearm & Clenched Fist -->
      <path d="M -82 10 C -86 8, -90 -4, -86 -16 C -82 -26, -76 -36, -68 -38 C -64 -39, -66 -32, -72 -22 C -78 -12, -78 2, -82 10 Z"/>
      <!-- Massive Chest / Pecs -->
      <path d="M -22 -42 C -32 -38, -46 -30, -42 -8 C -40 6, -26 12, -18 8 C -14 5, -16 -12, -18 -26 Z"/>
      <!-- Abs / Core & Serratus -->
      <path d="M -38 -6 C -34 16, -30 36, -18 48 C -14 44, -18 20, -22 6 Z"/>
      <path d="M -30 20 C -26 30, -22 42, -14 52 C -10 50, -14 36, -18 22 Z"/>
      <!-- Wing Latissimus -->
      <path d="M -54 -12 C -62 4, -58 26, -46 44 C -44 42, -48 24, -46 10 Z"/>
    </g>

    <!-- Right Bodybuilder (Athletic / Female / Twin Silhouette Facing Center) -->
    <g fill="url(#redGradient)">
      <!-- Head / Profile -->
      <path d="M 24 -68 C 20 -78, 34 -82, 40 -74 C 44 -68, 42 -58, 36 -56 C 32 -54, 28 -56, 24 -68 Z"/>
      <!-- Muscular Neck & Traps -->
      <path d="M 36 -55 C 46 -52, 58 -46, 64 -35 C 56 -36, 42 -40, 32 -42 Z"/>
      <!-- Right Massive Arm / Bicep -->
      <path d="M 64 -35 C 76 -25, 84 -8, 82 12 C 80 20, 74 24, 68 18 C 64 12, 62 -4, 58 -16 C 54 -28, 48 -32, 44 -35 Z"/>
      <!-- Forearm & Clenched Fist -->
      <path d="M 82 10 C 86 8, 90 -4, 86 -16 C 82 -26, 76 -36, 68 -38 C 64 -39, 66 -32, 72 -22 C 78 -12, 78 2, 82 10 Z"/>
      <!-- Chest / Defined Pecs -->
      <path d="M 22 -42 C 32 -38, 46 -30, 42 -8 C 40 6, 26 12, 18 8 C 14 5, 16 -12, 18 -26 Z"/>
      <!-- Core & Tight Waist -->
      <path d="M 38 -6 C 34 16, 30 36, 18 48 C 14 44, 18 20, 22 6 Z"/>
      <path d="M 30 20 C 26 30, 22 42, 14 52 C 10 50, 14 36, 18 22 Z"/>
      <!-- Right Wing Lat -->
      <path d="M 54 -12 C 62 4, 58 26, 46 44 C 44 42, 48 24, 46 10 Z"/>
    </g>

    <!-- Center Spine / Torch / Power Accent -->
    <path d="M 0 -62 L 3 -20 L 0 54 L -3 -20 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- ==================== TYPOGRAPHY: NEXUS ==================== -->
  <g transform="translate(320, 60)" filter="url(#glow)">

    <!-- ========== 3D Extrusion Shadows (Back Layer) ========== -->
    <g fill="url(#redShadow)" opacity="0.95" transform="translate(4, 6)">
      <!-- 'N' Shadow -->
      <path d="M 20 140 L 20 20 L 52 20 L 98 94 L 98 20 L 130 20 L 130 140 L 98 140 L 52 66 L 52 140 Z"/>
      <!-- 'E' Shadow -->
      <path d="M 155 140 L 155 20 L 245 20 L 245 48 L 190 48 L 190 66 L 238 66 L 238 94 L 190 94 L 190 112 L 248 112 L 248 140 Z"/>
      <!-- 'X' Red Slash Shadow -->
      <path d="M 360 20 L 398 20 L 298 140 L 260 140 Z"/>
      <!-- 'U' Shadow -->
      <path d="M 405 20 L 437 20 L 437 95 C 437 110, 446 118, 460 118 C 474 118, 483 110, 483 95 L 483 20 L 515 20 L 515 95 C 515 125, 492 142, 460 142 C 428 142, 405 125, 405 95 Z"/>
      <!-- 'S' Shadow -->
      <path d="M 535 110 L 565 106 C 568 116, 576 121, 590 121 C 603 121, 612 115, 612 106 C 612 96, 600 92, 576 86 C 545 78, 535 68, 535 48 C 535 28, 555 18, 588 18 C 620 18, 638 30, 642 50 L 612 54 C 610 44, 601 40, 588 40 C 576 40, 568 45, 568 53 C 568 61, 578 65, 602 71 C 632 78, 645 90, 645 109 C 645 131, 624 143, 589 143 C 555 143, 537 130, 535 110 Z"/>
    </g>

    <!-- ========== Main Red Letters Front Face ========== -->
    <!-- Letter 'N' -->
    <path d="M 20 140 L 20 20 L 52 20 L 98 94 L 98 20 L 130 20 L 130 140 L 98 140 L 52 66 L 52 140 Z"
          fill="url(#redGradient)" stroke="#FF6B6B" stroke-width="1.2"/>

    <!-- Letter 'E' -->
    <path d="M 155 140 L 155 20 L 245 20 L 245 48 L 190 48 L 190 66 L 238 66 L 238 94 L 190 94 L 190 112 L 248 112 L 248 140 Z"
          fill="url(#redGradient)" stroke="#FF6B6B" stroke-width="1.2"/>

    <!-- Letter 'X' - RED BACKSLASH (Bottom-Left to Top-Right) -->
    <g>
      <path d="M 360 20 L 398 20 L 298 140 L 260 140 Z"
            fill="url(#redGradient)" stroke="#FF6B6B" stroke-width="1.2"/>
    </g>

    <!-- Letter 'X' - THE SIGNATURE SILVER / CHROME EXTENDED SPEED BLADE (Top-Left to Bottom-Right) -->
    <!-- Notice this blade extends past the top (-18) down past the bottom (+172) cutting across -->
    <g>
      <!-- Subtle shadow underneath the silver blade -->
      <path d="M 266 -14 L 308 -14 L 388 174 L 346 174 Z" fill="#000000" opacity="0.6"/>

      <!-- Main Extended Chrome Blade -->
      <path d="M 264 -16 L 306 -16 L 386 172 L 344 172 Z"
            fill="url(#chromeSlash)" stroke="#FFFFFF" stroke-width="1.8"/>

      <!-- High-tech inner speed lines / channel cut on the blade -->
      <path d="M 288 -12 L 294 -12 L 366 168 L 360 168 Z"
            fill="#0F172A" opacity="0.85"/>

      <!-- Sharp metallic highlight reflection -->
      <path d="M 268 -14 L 273 -14 L 349 170 L 346 170 Z"
            fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Letter 'U' -->
    <path d="M 405 20 L 437 20 L 437 95 C 437 110, 446 118, 460 118 C 474 118, 483 110, 483 95 L 483 20 L 515 20 L 515 95 C 515 125, 492 142, 460 142 C 428 142, 405 125, 405 95 Z"
          fill="url(#redGradient)" stroke="#FF6B6B" stroke-width="1.2"/>

    <!-- Letter 'S' -->
    <path d="M 535 110 L 565 106 C 568 116, 576 121, 590 121 C 603 121, 612 115, 612 106 C 612 96, 600 92, 576 86 C 545 78, 535 68, 535 48 C 535 28, 555 18, 588 18 C 620 18, 638 30, 642 50 L 612 54 C 610 44, 601 40, 588 40 C 576 40, 568 45, 568 53 C 568 61, 578 65, 602 71 C 632 78, 645 90, 645 109 C 645 131, 624 143, 589 143 C 555 143, 537 130, 535 110 Z"
          fill="url(#redGradient)" stroke="#FF6B6B" stroke-width="1.2"/>

    <!-- TM Symbol Badge -->
    <g transform="translate(650, 16)">
      <rect x="0" y="0" width="22" height="15" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
      <text x="11" y="11" fill="#FFFFFF" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle">TM</text>
    </g>

    <!-- ========== SUB-HEADER: FITNESS CLUB ========== -->
    <g transform="translate(30, 192)">
      <text x="0" y="0"
            fill="#FFFFFF"
            font-family="'Montserrat', 'Inter', 'Oswald', sans-serif"
            font-size="34"
            font-weight="900"
            letter-spacing="14px">FITNESS CLUB</text>
    </g>
  </g>
</svg>
